# Yukti constraint catalogue (spec §13.6). Thresholds are data, not code.
# Governed file: safety owner review + config version bump + 24 h safety-hold (spec §9.5, Annexure I).
# v2 (Milestone 2): H2 alert rings (5 km warning, 2 km alarm; prompt §10.7) moved here from code.
# v3 (Milestone 3): H1 also counts state disaster authority (SDMA) alerts (decided 2026-11-03, beyond the
#   spec's IMD/INCOIS); H1/H7 split by alert kind; H4 coast; S1 radius; search limits for route planning.
version: 3
hard:
  H1:
    name: "Official warning active"
    issuers: [IMD, INCOIS, SDMA]
    # every alert kind except the ones H7 owns
  H2: { name: "IMBL buffer", imbl_min_km: 5, alert_rings_km: { warning: 5, alarm: 2 } }
  H3: { name: "Marine National Park", layer: mpa_gom }
  H4: { name: "Fishing ban (mechanised, EEZ)", coast: east, east: ["04-15", "06-14"], west: ["06-01", "07-31"], exempt: [non_motorised] }
  H5: { name: "Wave limit", per_boat: max_wave_m }
  H6: { name: "Wind limit", per_boat: max_wind_kmh }
  H7: { name: "Thunderstorm nowcast", kinds: [thunderstorm] }
  H8: { name: "Data freshness", max_age_h: { waves: 6, warnings: 1, pfz: 24, sst: 48, chl: 48 } }
soft:
  S1: { name: "PFZ score and INCOIS agreement", weight: 0.4, near_km: 10 }
  S2: { name: "Fuel margin", margin: 0.2, weight: 0.2 }
  S3: { name: "Risk margin", caution_at: 0.6 }
  S4: { name: "Back before sunset (small boats)", applies: [non_motorised, small_frp], weight: 0.2 }
  S5: { name: "Sources agree", wave_tolerance_m: 0.5, weight: 0.2 }
search:
  depart_step_min: 30
  horizon_h: 24
  local_radius_km: 10       # a trip with no destination is checked over sea cells this close to the harbour
  max_expansions: 60000     # A* node budget per route
