[project]
name = "ty-channels"
version = "0.1.0"
description = "TarangYukti — Voice and device API: Sarvam STT/TTS, positions, push subscriptions, phone link"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ty-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "sarvamai>=0.1",
    "langgraph-sdk>=0.1",
    "supabase>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
    "opentelemetry-distro>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "psycopg[binary,pool]>=3.2",
    "fastmcp>=2.12",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
    "fakeredis>=2.26",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ty_channels"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["llm: calls a live model", "gpu: needs a GPU"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["UP046", "UP047"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.uv.sources]
ty-common = { path = "../../packages/ty-common", editable = true }
