# Approved safety wording for English (prompt §10). The LLM only fills {slots}.
# Every config/phrases/<code>.yaml has the same keys. Drafts for other languages come from
# sarvam-translate:v1 (Milestone 10a); only files with status: approved are released.
# Governed file: language owner.
status: draft
reviewers: []
reviewed_on: null
verdict:
  GO: "Good to go."
  CAUTION: "Go, but carefully — back by {back_by}."
  NO-GO: "Don't go today. Next good time: {next_window}."
why:
  H5: "Waves get too high after {time}."
  H2: "That route goes too close to the border line."
  H1: "There is an official {issuer} warning: {warning_name}."
  H3: "That area is inside the protected marine park."
  H4: "It is the fishing ban season for mechanised boats."
  H6: "The wind gets too strong after {time}."
  H7: "There is an official thunderstorm warning: {warning_name}."
  H8: "Some data is old or missing, so the sea cannot be checked."
spot: "Fish likely {distance_km} km {direction}."
border: "Border line is {distance_km} km away."
stale: "Old forecast — check again before leaving."
footer: "Advisory only — follow official INCOIS/IMD warnings."
# Milestone 5: agent fallbacks (draft until reviewed)
needs_network: "I need the internet to answer that. The buttons still work: Today's sea, Where to fish, Alerts, I'm back."
nothing_found: "I found nothing about this in the official documents. Please ask the {source}."
cannot_verify: "I could not check this answer against the data, so I will not give it. Please use the buttons or ask again."
