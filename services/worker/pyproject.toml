[project]
name = "ty-worker"
version = "0.1.0"
description = "TarangYukti — Ingest, kb_index, watch (brief, trips, alerts) and push (Expo + web)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ty-common",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "google-genai>=1.0",
    "azure-monitor-opentelemetry>=1.6",
    "xarray>=2024.10",
    "netCDF4>=1.7",
    "copernicusmarine>=2.0",
    "pyyaml>=6.0",
    "pywebpush>=2.0",
    "opentelemetry-distro>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
    "fakeredis>=2.26",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ty_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["llm: calls a live model", "gpu: needs a GPU"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["UP046", "UP047"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.uv.sources]
ty-common = { path = "../../packages/ty-common", editable = true }
