# Allow-listed knowledge-base documents (spec §6.2.2). Governed file: data owner.
# Every url's domain must be in config/sources.yaml allowlist_domains. `file` = a document kept in this repo
# (its url is the published copy). Validity fields are ISO dates or null; region is null (national) or a
# [lon_min, lat_min, lon_max, lat_max] box. Live bulletins (CAP alerts) are ingested by the job itself.
# `captured`: a copy saved by hand from a browser (for sites that refuse automated clients); used when present,
# otherwise the url is fetched.
