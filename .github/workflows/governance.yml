# Governance (prompt §12, spec §9.5, Annexure I for a solo build).
# - version-bump gate: governed config changes bump `version:`; phrases, prompts and model settings add a line to
#   docs/releases.md; every governed path has a code owner.
# - safety-hold: a PR touching governed files needs the `safety-hold` label and stays red until 24 hours after its
#   last commit (re-run the check after that). It replaces the second reviewer when one person holds every role.
name: governance
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  version-bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: governed files carry a version bump or release note
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}";
          else BASE="${{ github.event.before }}"; fi
          git cat-file -e "$BASE" 2>/dev/null || BASE="HEAD~1"
          python3 -m pip install --quiet pyyaml >/dev/null 2>&1 || true
          python3 scripts/check_governed.py "$BASE" HEAD

  safety-hold:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 24-hour hold on safety, language, AI and data changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          GOVERNED='^(config/(constraints|boats|qc|sources|languages|aliases|harbours|governance)\.yaml|config/phrases/|apps/agent/src/prompts/|kb/sources/)'
          if ! git diff --name-only "$BASE"..HEAD | grep -Eq "$GOVERNED"; then echo "no governed files"; exit 0; fi
          case ",$LABELS," in *,safety-hold,*) ;; *) echo "::error::governed files changed: add the safety-hold label"; exit 1;; esac
          LAST=$(git log -1 --format=%ct HEAD); NOW=$(date +%s); LEFT=$(( 86400 - (NOW - LAST) ))
          if [ "$LEFT" -gt 0 ]; then echo "::error::safety-hold: $((LEFT / 3600)) h left after the last commit (re-run then)"; exit 1; fi
          echo "safety-hold: 24 hours passed since the last commit"
