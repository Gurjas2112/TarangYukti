# All 22 scheduled languages + English (spec §6.5). No language is built in.
# status changes only through spec §9.5: two native-speaker reviewers sign config/phrases/<code>.yaml
# and the language's golden set + promptfoo tests pass. Every language starts as draft.
# code = BCP-47 (app, testIDs, file names); sarvam_code = what Sarvam APIs expect.
