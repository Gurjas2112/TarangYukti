# Supabase CLI config (spec §13.5). Cloud project: jbvjquxpuocvwqcitvhz (Mumbai).
# Link once: pnpm dlx supabase link --project-ref jbvjquxpuocvwqcitvhz ; then `supabase db push`.
project_id = "tarangyukti"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]   # schema `agent` is never exposed through the Data API
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081", "tarangyukti://auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
signing_keys_path = "./signing_keys.json"

[auth.email]
enable_signup = false                 # Google is the only way to create an account
otp_expiry = 600                      # "Add this phone" QR tokens expire after 10 minutes

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
skip_nonce_check = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# TODO(tarangyukti): Milestone 9 adds public.custom_access_token_hook; enable this then.
[auth.hook.custom_access_token]
enabled = false
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true
file_size_limit = "50MiB"
