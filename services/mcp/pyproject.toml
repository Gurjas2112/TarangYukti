[project]
name = "tarangyukti"
version = "0.1.0"
description = "TarangYukti — FastMCP data tools, Yukti constraint engine and RAG retriever"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ty-common",
    "fastmcp>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "redis>=5.2",
    "neo4j>=5.27",
    "xarray>=2024.10",
    "netCDF4>=1.7",
    "copernicusmarine>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "h3>=4.1",
    "networkx>=3.4",
    "scikit-image>=0.24",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "azure-monitor-opentelemetry>=1.6",
    "pyjwt[crypto]>=2.10",
    "opentelemetry-distro>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
    "fakeredis>=2.26",
    "httpx>=0.28",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarangyukti"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["llm: calls a live model", "gpu: needs a GPU"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["UP046", "UP047", "RUF001", "RUF002", "RUF003", "ASYNC109"]  # en dashes are intentional; httpx owns timeouts

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.uv.sources]
ty-common = { path = "../../packages/ty-common", editable = true }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
