appId: in.tarangyukti.kadalmitra
---
# F01–F06. Without a test Google account on the emulator the flow takes "Not now" (F05/F06 stay a gap).
- extendedWaitUntil: { visible: { id: "onboarding-language" }, timeout: 60000 }
- takeScreenshot: A01-onboarding/01-language-picker
- scrollUntilVisible: { element: { id: "lang-${APP_LANG}" }, direction: DOWN, timeout: 30000, visibilityPercentage: 50 }
- tapOn: { id: "lang-speak-${APP_LANG}", optional: true }
- takeScreenshot: A01-onboarding/02-language-spoken
- tapOn: { id: "lang-${APP_LANG}" }
- extendedWaitUntil: { visible: { id: "harbour-rameswaram" }, timeout: 60000 }
- takeScreenshot: A01-onboarding/03-harbour
- tapOn: { id: "harbour-rameswaram" }
- runFlow:
    when: { visible: { id: "suggest-keep" } }
    commands: [{ tapOn: { id: "suggest-keep" } }]
- extendedWaitUntil: { visible: { id: "boat-small_frp" }, timeout: 30000 }
- takeScreenshot: A01-onboarding/04-boat
- tapOn: { id: "boat-small_frp" }
- extendedWaitUntil: { visible: { id: "turn-on-alerts" }, timeout: 30000 }
- takeScreenshot: A01-onboarding/05-consent
- tapOn: { id: "read-notice" }
- extendedWaitUntil: { visible: { id: "notice-screen" }, timeout: 30000 }
- takeScreenshot: A01-onboarding/06-full-notice
- back
- tapOn: { id: "alerts-not-now" }
- extendedWaitUntil: { visible: { id: "verdict-card" }, timeout: 90000 }
