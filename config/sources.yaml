# Allow-listed data sources (spec §13.8). Tools fetch only from these domains. Governed file: data owner.
# v5 (Milestone 4): + fisheries.tn.gov.in, un.org (knowledge-base documents); kb supersession rule and
#   sanitiser patterns.
# v4 (Milestone 3): sdma_alerts endpoint (H1 counts state authority alerts).
# v3: + sachet.ndma.gov.in (NDMA CAP hub: live IMD + INCOIS alerts, free; the IMD API needs whitelisting).
# v2 (Milestone 2): + coastwatch.noaa.gov (NOAA moved VIIRS chlorophyll there), + data-gis.unep-wcmc.org (WDPA),
#                   endpoints per tool.
version: 5
allowlist_domains: [incois.gov.in, erddap.incois.gov.in, mosdac.gov.in, api.imd.gov.in, mausam.imd.gov.in,
                    marine-api.open-meteo.com, api.open-meteo.com, coastwatch.pfeg.noaa.gov, coastwatch.noaa.gov,
                    globalfishingwatch.org, gateway.api.globalfishingwatch.org, pib.gov.in, eprints.cmfri.org.in,
                    data-gis.unep-wcmc.org, sachet.ndma.gov.in, fisheries.tn.gov.in, un.org]
cache_ttl_s: { warnings: 300, forecast: 3600, pfz: 86400, sst: 86400, chl: 86400, layers: 2592000 }

endpoints:
  open_meteo_marine:
    url: https://marine-api.open-meteo.com/v1/marine
    name: "Open-Meteo Marine"
    hourly: [wave_height, wave_direction, wave_period, swell_wave_height, ocean_current_velocity,
             ocean_current_direction, sea_surface_temperature]
  open_meteo_wind:
    url: https://api.open-meteo.com/v1/forecast
    name: "Open-Meteo Forecast (wind at 10 m)"
    hourly: [wind_speed_10m, wind_gusts_10m, wind_direction_10m]
  sst:
    # OISST v2.1 near-real-time, 0.25°, daily (the final ncdcOisst21Agg lags ~2 weeks)
    url: https://coastwatch.pfeg.noaa.gov/erddap/griddap/ncdcOisst21NrtAgg.json
    name: "NOAA OISST v2.1 NRT (CoastWatch ERDDAP)"
    variable: sst
    query: "sst[(last)][(0.0)][({lat_min}):({lat_max})][({lon_min}):({lon_max})]"
  chl:
    # NOAA-20 VIIRS chlorophyll NRT, 4 km, daily (replaces the retired erdMH1chla1day_R2022NRT)
    url: https://coastwatch.noaa.gov/erddap/griddap/noaacwN20VIIRSchlaDaily.json
    name: "NOAA-20 VIIRS chlorophyll-a NRT (CoastWatch ERDDAP)"
    variable: chlor_a
    query: "chlor_a[(last)][(0.0)][({lat_max}):({lat_min})][({lon_min}):({lon_max})]"
  sachet:
    # NDMA SACHET: official CAP 1.2 alerts from IMD regional centres and INCOIS (public, free)
    name: "NDMA SACHET (CAP)"
    url: https://sachet.ndma.gov.in/
    active_url: https://sachet.ndma.gov.in/cap_public_website/FetchAllAlertDetails
    rss_url: https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml
    cap_url: "https://sachet.ndma.gov.in/cap_public_website/FetchXMLFile?identifier={identifier}"
    polygon_url: "https://sachet.ndma.gov.in/cap_public_website/FetchPolygonXMLFile?identifier={identifier}"
    # alerts are shortlisted by location (centroid within the region box + margin); the RSS fallback has no
    # centroids, so it shortlists by these disseminating sources instead
    rss_sources: ["IMD Chennai", "INCOIS", "Tamil Nadu SDMA", "Puducherry SDMA"]
    prefilter_margin_deg: 2.0
  imd:
    # the IMD API itself is IP-whitelisted (not used); IMD alerts arrive through SACHET
    url: https://sachet.ndma.gov.in/
    name: "IMD (via NDMA SACHET CAP)"
  incois_alerts:
    url: https://sachet.ndma.gov.in/
    name: "INCOIS (via NDMA SACHET CAP)"
  sdma_alerts:
    url: https://sachet.ndma.gov.in/
    name: "State disaster authority (via NDMA SACHET CAP)"
  incois_pfz:
    url: https://incois.gov.in/MarineFisheries/PfzAdvisory
    name: "INCOIS PFZ advisory"

kb:
  # Cross-document supersession (spec §6.2.9): a newer document replaces older ones it names.
  # cap_references: a CAP alert whose <references> lists earlier alerts supersedes them.
  supersession: [cap_references]
  # Live bulletins ingested as documents (regional IMD / INCOIS / SDMA CAP alerts, with validity windows)
  live_bulletins: [IMD, INCOIS, SDMA]
  # Sanitiser: documents matching any of these (case-insensitive) are quarantined for review, never searched
  quarantine_patterns:
    - "ignore (all |any |the )?(previous|prior|above) (instructions|prompts?)"
    - "disregard (all |any |the )?(previous|prior|above)"
    - "you are now (a|an|the) "
    - "(reveal|print|show) (your|the) (system )?prompt"
    - '<\s*script'
    - '\bact as (a|an) '
